paths:
  bronze: data/bronze
  silver: data/silver/jobs.parquet
  bayt_bronze: data/bronze/bayt/bayt_jobs.jsonl

sources: [careerjet, jsearch, bayt]

# A title must contain one of its role's keywords (whole words) to be is_relevant
role_keywords:
  software engineer: [software, full stack, full-stack, fullstack, backend, back-end, frontend, front-end, developer, devops, devsecops, android, ios, mobile]
  data engineer: [data engineer, data engineering, big data, etl, analytics engineer, data platform, data pipeline, data scientist, dataops, ml engineer]
  frontend developer: [frontend, front-end, front end, react, angular, vue, javascript, ui developer, web developer, full stack, full-stack, fullstack]
  backend developer: [backend, back-end, back end, api, .net, dotnet, java, php, node, python, django, golang, full stack, full-stack, fullstack]
  ai engineer: [ai, artificial intelligence, machine learning, ml, deep learning, llm, generative, computer vision, nlp, data scientist, الذكاء الاصطناعي]

# A title containing any of these is never relevant
role_exclude: [civil, mechanical, electrical, hse, construction, procurement, facade, façade, fire protection, cost control, planning engineer]

# --- Bayt scraper (src/scrapers/bayt_scraper.py) ----------------------
# category name = target_role in silver
# English only: /ar/ pages list the same job IDs, so scanning both doubles run time
job_search_urls:
  software engineer:
    en: https://www.bayt.com/en/saudi-arabia/jobs/software-engineer-jobs/
  data engineer:
    en: https://www.bayt.com/en/saudi-arabia/jobs/data-engineer-jobs/
  frontend developer:
    en: https://www.bayt.com/en/saudi-arabia/jobs/frontend-developer-jobs/
  backend developer:
    en: https://www.bayt.com/en/saudi-arabia/jobs/backend-developer-jobs/
  ai engineer:
    en: https://www.bayt.com/en/saudi-arabia/jobs/ai-engineer-jobs/

crawl:
  max_pages_per_url: 5
  max_empty_pages: 2
  jobs_per_page: 25
  job_detail_enabled: true
  status_check_enabled: true

antibot:
  impersonate: chrome131
  proxy: null

throttle:
  download_delay: 3.0
